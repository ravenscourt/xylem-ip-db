name: Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Lint
        run: ruff check scripts/

      - name: Check Formatting
        run: ruff format scripts/ --check

      - name: Run Tests
        run: pytest -v
