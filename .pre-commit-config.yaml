repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: tests
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
